name: Deploy

on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: false

jobs:
  web:
    name: Web (Vercel)
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Check credentials
        if: env.VERCEL_TOKEN == ''
        run: echo "VERCEL_TOKEN is not configured — skipping the web deployment."

      - uses: actions/checkout@v4
        if: env.VERCEL_TOKEN != ''
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: pnpm/action-setup@v4
        if: env.VERCEL_TOKEN != ''

      - uses: actions/setup-node@v4
        if: env.VERCEL_TOKEN != ''
        with:
          node-version: 22
          cache: pnpm

      - name: Deploy to Vercel
        if: env.VERCEL_TOKEN != ''
        working-directory: apps/web
        run: |
          pnpm dlx vercel@latest pull --yes --environment=production --token "$VERCEL_TOKEN"
          pnpm dlx vercel@latest build --prod --token "$VERCEL_TOKEN"
          pnpm dlx vercel@latest deploy --prebuilt --prod --token "$VERCEL_TOKEN"

  api:
    name: API (Railway)
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Check credentials
        if: env.RAILWAY_TOKEN == ''
        run: echo "RAILWAY_TOKEN is not configured — skipping the API deployment."

      - uses: actions/checkout@v4
        if: env.RAILWAY_TOKEN != ''
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: pnpm/action-setup@v4
        if: env.RAILWAY_TOKEN != ''

      - uses: actions/setup-node@v4
        if: env.RAILWAY_TOKEN != ''
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        if: env.RAILWAY_TOKEN != ''
        run: pnpm install --frozen-lockfile

      - name: Apply database migrations
        if: env.RAILWAY_TOKEN != '' && env.DATABASE_URL != ''
        working-directory: apps/api
        run: pnpm exec prisma migrate deploy

      - name: Deploy to Railway
        if: env.RAILWAY_TOKEN != ''
        run: |
          pnpm dlx @railway/cli@latest up --service "${{ vars.RAILWAY_SERVICE || 'deckup-api' }}" --detach

name: Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  web:
    name: Web (Vercel)
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Check credentials
        if: env.VERCEL_TOKEN == ''
        run: echo "VERCEL_TOKEN is not configured — skipping the web deployment."

      - uses: actions/checkout@v4
        if: env.VERCEL_TOKEN != ''

      - uses: pnpm/action-setup@v4
        if: env.VERCEL_TOKEN != ''

      - uses: actions/setup-node@v4
        if: env.VERCEL_TOKEN != ''
        with:
          node-version: 22
          cache: pnpm

      - name: Deploy to Vercel
        if: env.VERCEL_TOKEN != ''
        working-directory: apps/web
        run: |
          pnpm dlx vercel@latest pull --yes --environment=production --token "$VERCEL_TOKEN"
          pnpm dlx vercel@latest build --prod --token "$VERCEL_TOKEN"
          pnpm dlx vercel@latest deploy --prebuilt --prod --token "$VERCEL_TOKEN"

  api:
    name: API (Railway)
    runs-on: ubuntu-latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - name: Check credentials
        if: env.RAILWAY_TOKEN == ''
        run: echo "RAILWAY_TOKEN is not configured — skipping the API deployment."

      - uses: actions/checkout@v4
        if: env.RAILWAY_TOKEN != ''

      - name: Deploy to Railway
        if: env.RAILWAY_TOKEN != ''
        run: |
          pnpm dlx @railway/cli@latest up --service "${{ vars.RAILWAY_SERVICE ?? 'deckup-api' }}" --detach

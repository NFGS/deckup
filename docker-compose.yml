name: deckup

services:
  db:
    image: postgres:17-alpine
    container_name: deckup-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-deckup}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-deckup}
      POSTGRES_DB: ${POSTGRES_DB:-deckup}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - deckup-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-deckup} -d ${POSTGRES_DB:-deckup}']
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:5
    container_name: deckup-adminer
    restart: unless-stopped
    ports:
      - '${ADMINER_PORT:-8080}:8080'
    depends_on:
      db:
        condition: service_healthy

volumes:
  deckup-db-data:
